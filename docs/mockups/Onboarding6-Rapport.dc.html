<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
.light{--bg-base:#F4FAF6;--g1:#F6FBF8;--g2:#EEF7F1;--g3:#E3F1E9;--glass:rgba(255,255,255,0.28);--ghi:rgba(255,255,255,0.80);--sheen:rgba(255,255,255,0.38);--accent:#5E8C72;--accent2:#4A7560;--accentsoft:#A8C9B5;--onacc:#FFFFFF;--tp:#22302A;--ts:#5A6B62;--tt:#8A9890;--gshadow:0 10px 34px rgba(94,140,114,0.10);--blur:50px;--blobA:rgba(168,201,181,0.5);--blobB:rgba(200,230,212,0.6);--blobC:rgba(255,255,255,0.7);--bgtop:rgba(255,255,255,0.95);--bgbot:rgba(255,255,255,0.50);--bw:1.5px;--glow-border:0 0 8px rgba(255,255,255,0.25);--reflet:inset 0 1px 1.5px rgba(255,255,255,0.60);--clight:rgba(88,178,130,0.52)}
.dark{--bg-base:#070C09;--g1:#090F0B;--g2:#0C1611;--g3:#101F17;--glass:rgba(46,66,55,0.32);--ghi:rgba(205,255,224,0.55);--sheen:rgba(200,245,222,0.18);--accent:#9CC4AC;--accent2:#B4D6C2;--accentsoft:#3A5446;--onacc:#0F1712;--tp:#EAF2ED;--ts:#A7B8AE;--tt:#6E7E75;--gshadow:0 32px 84px rgba(0,0,0,0.66);--blur:58px;--blobA:rgba(64,150,108,0.6);--blobB:rgba(110,190,150,0.42);--blobC:rgba(38,100,74,0.62);--bgtop:rgba(200,230,212,0.65);--bgbot:rgba(156,196,172,0.30);--bw:2px;--glow-border:0 0 12px rgba(200,230,212,0.15);--reflet:inset 0 1px 2px rgba(220,255,230,0.20);--clight:rgba(178,242,208,0.28)}
.phone{width:412px;height:892px;border-radius:48px;overflow:hidden;position:relative;background:var(--bg-base);box-shadow:0 40px 90px rgba(20,30,25,0.28);font-family:'Nunito Sans',sans-serif;color:var(--tp)}
.bg{position:absolute;inset:0;z-index:0;background:linear-gradient(160deg,var(--g1),var(--g2) 55%,var(--g3))}
.blob{position:absolute;border-radius:50%;filter:blur(42px)}
.blob.a{width:360px;height:360px;left:-110px;top:10px;background:radial-gradient(circle,var(--blobA),transparent 66%);animation:drift1 16s ease-in-out infinite}
.blob.b{width:320px;height:320px;right:-120px;top:290px;background:radial-gradient(circle,var(--blobB),transparent 68%);animation:drift2 19s ease-in-out infinite}
.blob.c{width:300px;height:300px;left:30px;bottom:-90px;background:radial-gradient(circle,var(--blobC),transparent 70%);animation:drift1 23s ease-in-out infinite}
.caustic{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,var(--clight),transparent 68%)}
.glass{background:linear-gradient(180deg,var(--sheen),transparent 44%) padding-box,var(--glass) padding-box,linear-gradient(180deg,var(--bgtop),var(--bgbot)) border-box;backdrop-filter:blur(var(--blur)) saturate(200%);-webkit-backdrop-filter:blur(var(--blur)) saturate(200%);border:var(--bw) solid transparent;box-shadow:var(--gshadow),var(--glow-border),var(--reflet),inset 0 1px 0 var(--ghi),inset 0 -14px 32px rgba(255,255,255,0.05)}
.content{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:0 24px;opacity:1;transform:translateX(0);transition:opacity 300ms cubic-bezier(.22,1,.36,1),transform 350ms cubic-bezier(.22,1,.36,1)}
.content.from-right{opacity:0;transform:translateX(32px)}.content.exit-left{opacity:0;transform:translateX(-32px)}
.statusbar{height:46px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding:0 4px}
.time{font-weight:700;font-size:15px;letter-spacing:.3px}.sysicons{display:flex;align-items:center;gap:7px;color:var(--tp)}
.progbar{display:flex;gap:5px;flex-shrink:0}
.progseg{flex:1;height:4px;border-radius:2px;background:var(--accentsoft)}.progseg.done{background:var(--accent)}
.stitle{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:24px;letter-spacing:-.8px;line-height:1.2;margin-top:18px;flex-shrink:0}
.sdesc{font-size:14px;color:var(--ts);line-height:1.6;margin-top:8px;flex-shrink:0}
.scroll{flex:1;overflow-y:auto;padding-top:14px;padding-bottom:4px}
.bottom{flex-shrink:0}
.btnprim{width:100%;padding:18px 24px;border-radius:999px;background:var(--accent);color:var(--onacc);font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:16px;border:none;cursor:pointer;margin-top:14px}
.homeind{height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pill{width:122px;height:5px;border-radius:3px;background:var(--tp);opacity:.32}
.scard{border-radius:22px;padding:18px;margin-top:12px}
.slabel{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:14px;color:var(--ts);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px;font-size:11px}
.dayrow{display:flex;gap:4px;margin-top:4px}
.daybtn{flex:1;padding:9px 2px;border-radius:12px;font-size:12px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;color:var(--ts);cursor:pointer;border:none;background:transparent;text-align:center;transition:all .2s cubic-bezier(.34,1.56,.64,1)}
.daybtn.on{background:var(--accent);color:var(--onacc);border-radius:12px}
.timerow{display:flex;gap:5px;margin-top:10px}
.timebtn{flex:1;padding:9px 4px;border-radius:12px;font-size:13px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;color:var(--ts);cursor:pointer;border:none;background:transparent;text-align:center;transition:all .2s cubic-bezier(.34,1.56,.64,1)}
.timebtn.on{background:var(--accent);color:var(--onacc)}
.notifcard{border-radius:20px;padding:16px 18px;margin-top:12px;background:var(--accentsoft);border:1.5px solid var(--accentsoft)}
.dark .notifcard{background:rgba(58,84,70,0.5);border-color:rgba(156,196,172,0.20)}
.notifhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.notificon{width:36px;height:36px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.notiflabel{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14px}
.notifapp{font-size:12px;color:var(--ts);margin-top:1px}
.notifline{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid rgba(94,140,114,0.15);color:var(--ts)}
.dark .notifline{border-top-color:rgba(156,196,172,0.12)}
.notifval{font-weight:700;color:var(--tp)}
.notifarrow{color:var(--accent);font-weight:700}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,55px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,-45px)}}
@keyframes cf1{0%,100%{transform:translate(0,0) scale(1) rotate(0deg)}33%{transform:translate(22px,-16px) scale(1.18) rotate(14deg)}66%{transform:translate(-14px,22px) scale(.88) rotate(-9deg)}}
@keyframes cf2{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(-20px,14px) scale(1.22) rotate(6deg)}70%{transform:translate(16px,-11px) scale(.84) rotate(-11deg)}}
@keyframes cf3{0%,100%{transform:translate(0,0) scale(1) rotate(0deg)}50%{transform:translate(12px,24px) scale(1.12) rotate(22deg)}}
.still .blob,.still .caustic{animation:none}@keyframes riseIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</helmet>
<div class="phone {{ theme }}"><div class="bg"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div><div class="caustic a"></div><div class="caustic b"></div><div class="caustic c"></div><div class="caustic d"></div><div class="caustic e"></div></div><div class="content"><div class="statusbar"><span class="time">9:41</span><div class="sysicons"><svg width="18" height="16" viewBox="0 0 18 16" fill="currentColor"><rect x="0" y="11" width="3" height="5" rx="1"></rect><rect x="5" y="8" width="3" height="8" rx="1"></rect><rect x="10" y="5" width="3" height="11" rx="1"></rect><rect x="15" y="2" width="3" height="14" rx="1"></rect></svg><svg width="25" height="14" viewBox="0 0 25 14" fill="none"><rect x="1" y="1.5" width="20" height="11" rx="3.5" stroke="currentColor" stroke-width="1.4"></rect><rect x="3" y="3.5" width="13.5" height="7" rx="2" fill="currentColor"></rect><rect x="22.5" y="4.5" width="2" height="5" rx="1" fill="currentColor"></rect></svg></div></div><div class="progbar"><div class="progseg done"></div><div class="progseg done"></div><div class="progseg done"></div><div class="progseg done"></div><div class="progseg done"></div><div class="progseg done"></div><div class="progseg"></div></div><div class="stitle">Ton bilan du dimanche</div><div class="sdesc">Chaque semaine, un résumé calme de tes progrès.</div><div class="scroll"><div class="scard glass"><div class="slabel">Jour</div><div class="dayrow"><button class="{{ dLun }}" onClick="{{ setLun }}">Lun</button><button class="{{ dMar }}" onClick="{{ setMar }}">Mar</button><button class="{{ dMer }}" onClick="{{ setMer }}">Mer</button><button class="{{ dJeu }}" onClick="{{ setJeu }}">Jeu</button><button class="{{ dVen }}" onClick="{{ setVen }}">Ven</button><button class="{{ dSam }}" onClick="{{ setSam }}">Sam</button><button class="{{ dDim }}" onClick="{{ setDim }}">Dim</button></div><div class="slabel" style="margin-top:16px">Heure</div><div class="timerow"><button class="{{ h18 }}" onClick="{{ setH18 }}">18h</button><button class="{{ h19 }}" onClick="{{ setH19 }}">19h</button><button class="{{ h20 }}" onClick="{{ setH20 }}">20h</button><button class="{{ h21 }}" onClick="{{ setH21 }}">21h</button><button class="{{ h22 }}" onClick="{{ setH22 }}">22h</button></div></div><div class="notifcard"><div class="notifhead"><div class="notificon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--onacc)" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></div><div><div class="notiflabel">Tes stats de cette semaine</div><div class="notifapp">NoDoomScroll · {{ dayLabel }}</div></div></div><div class="notifline"><span>Streak</span><span class="notifval">12 jours <span class="notifarrow">→</span></span></div><div class="notifline"><span>Tentatives bloquées</span><span class="notifval">47 <span class="notifarrow">→</span></span></div><div class="notifline"><span>Tendance</span><span class="notifval notifarrow">↑ Mieux qu'avant</span></div></div></div><div class="bottom"><button class="btnprim" onClick="{{ goNext }}">Continuer</button></div><div class="homeind"><div class="pill"></div></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;412px&quot;,&quot;height&quot;:&quot;892px&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;}}">
class Component extends DCLogic {
  state = { day: 'Dim', hour: '20h' };
  componentDidMount() {
    const root = ReactDOM.findDOMNode(this);
    if (!root) return;
    const el = root.querySelector('.content');
    if (el) { el.classList.add('from-right'); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('from-right'))); }
    root.querySelectorAll('.scroll > *,.btnprimary').forEach((it,i)=>{ it.style.animation='riseIn .6s cubic-bezier(.22,1,.36,1) '+(0.06+i*0.09).toFixed(2)+'s both'; });
    const nc=root.querySelector('.notifcard'); if(nc) nc.style.animation='riseIn .75s cubic-bezier(.34,1.56,.64,1) .24s both';
    root.querySelectorAll('.caustic').forEach(c => {
      c.style.top=(Math.random()*72).toFixed(1)+'%'; c.style.left=(Math.random()*72).toFixed(1)+'%';
      c.style.width=Math.round(70+Math.random()*170)+'px'; c.style.height=Math.round(70+Math.random()*170)+'px';
      c.style.animationDuration=(5+Math.random()*9).toFixed(1)+'s'; c.style.animationDelay='-'+(Math.random()*12).toFixed(1)+'s';
    });
    const sc = root.querySelector('.scroll');
    if (sc) { sc.style.scrollbarWidth='none'; sc.style.msOverflowStyle='none'; }
    if (!document.getElementById('_noscr')) { const s=document.createElement('style'); s.id='_noscr'; s.textContent='.scroll::-webkit-scrollbar{display:none}'; document.head.appendChild(s); }
  }
  navigate(url) {
    const { day, hour } = this.state;
    const dayMap = { Lun:'Lundi', Mar:'Mardi', Mer:'Mercredi', Jeu:'Jeudi', Ven:'Vendredi', Sam:'Samedi', Dim:'Dimanche' };
    localStorage.setItem('nds_rapport', JSON.stringify({ day: dayMap[day] || day, hour }));
    const root = ReactDOM.findDOMNode(this);
    const el = root && root.querySelector('.content');
    if (el) el.classList.add('exit-left');
    setTimeout(() => { window.location.href = url; }, 320);
  }
  db(v) { const d=this.state.day; return (v===d?'daybtn on':'daybtn'); }
  hb(v) { const h=this.state.hour; return (v===h?'timebtn on':'timebtn'); }
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const dayMap = { Lun:'Lundi', Mar:'Mardi', Mer:'Mercredi', Jeu:'Jeudi', Ven:'Vendredi', Sam:'Samedi', Dim:'Dimanche' };
    const dayLabel = (dayMap[this.state.day] || this.state.day) + ' ' + this.state.hour;
    return {
      theme, dayLabel,
      dLun:this.db('Lun'), dMar:this.db('Mar'), dMer:this.db('Mer'), dJeu:this.db('Jeu'), dVen:this.db('Ven'), dSam:this.db('Sam'), dDim:this.db('Dim'),
      setLun:()=>this.setState({day:'Lun'}), setMar:()=>this.setState({day:'Mar'}), setMer:()=>this.setState({day:'Mer'}),
      setJeu:()=>this.setState({day:'Jeu'}), setVen:()=>this.setState({day:'Ven'}), setSam:()=>this.setState({day:'Sam'}), setDim:()=>this.setState({day:'Dim'}),
      h18:this.hb('18h'), h19:this.hb('19h'), h20:this.hb('20h'), h21:this.hb('21h'), h22:this.hb('22h'),
      setH18:()=>this.setState({hour:'18h'}), setH19:()=>this.setState({hour:'19h'}), setH20:()=>this.setState({hour:'20h'}),
      setH21:()=>this.setState({hour:'21h'}), setH22:()=>this.setState({hour:'22h'}),
      goNext: () => this.navigate('./Onboarding7-Confirmation.dc.html'),
    };
  }
}
</script>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
.light{--bg-base:#F4FAF6;--g1:#F6FBF8;--g2:#EEF7F1;--g3:#E3F1E9;--glass:rgba(255,255,255,0.28);--ghi:rgba(255,255,255,0.80);--sheen:rgba(255,255,255,0.38);--accent:#5E8C72;--accent2:#4A7560;--accentsoft:#A8C9B5;--onacc:#FFFFFF;--tp:#22302A;--ts:#5A6B62;--tt:#8A9890;--warn:#C99A5B;--warnbg:rgba(201,154,91,0.12);--warnborder:rgba(201,154,91,0.35);--gshadow:0 10px 34px rgba(94,140,114,0.10);--blur:50px;--blobA:rgba(168,201,181,0.5);--blobB:rgba(200,230,212,0.6);--blobC:rgba(255,255,255,0.7);--bgtop:rgba(255,255,255,0.95);--bgbot:rgba(255,255,255,0.50);--bw:1.5px;--glow-border:0 0 8px rgba(255,255,255,0.25);--reflet:inset 0 1px 1.5px rgba(255,255,255,0.60);--clight:rgba(88,178,130,0.52)}
.dark{--bg-base:#070C09;--g1:#090F0B;--g2:#0C1611;--g3:#101F17;--glass:rgba(46,66,55,0.32);--ghi:rgba(205,255,224,0.55);--sheen:rgba(200,245,222,0.18);--accent:#9CC4AC;--accent2:#B4D6C2;--accentsoft:#3A5446;--onacc:#0F1712;--tp:#EAF2ED;--ts:#A7B8AE;--tt:#6E7E75;--warn:#D4B483;--warnbg:rgba(212,180,131,0.10);--warnborder:rgba(212,180,131,0.28);--gshadow:0 32px 84px rgba(0,0,0,0.66);--blur:58px;--blobA:rgba(64,150,108,0.6);--blobB:rgba(110,190,150,0.42);--blobC:rgba(38,100,74,0.62);--bgtop:rgba(200,230,212,0.65);--bgbot:rgba(156,196,172,0.30);--bw:2px;--glow-border:0 0 12px rgba(200,230,212,0.15);--reflet:inset 0 1px 2px rgba(220,255,230,0.20);--clight:rgba(178,242,208,0.28)}
.phone{width:412px;height:892px;border-radius:48px;overflow:hidden;position:relative;background:var(--bg-base);box-shadow:0 40px 90px rgba(20,30,25,0.28);font-family:'Nunito Sans',sans-serif;color:var(--tp)}
.bg{position:absolute;inset:0;z-index:0;background:linear-gradient(160deg,var(--g1),var(--g2) 55%,var(--g3))}
.blob{position:absolute;border-radius:50%;filter:blur(42px)}
.blob.a{width:360px;height:360px;left:-110px;top:10px;background:radial-gradient(circle,var(--blobA),transparent 66%);animation:drift1 16s ease-in-out infinite}
.blob.b{width:320px;height:320px;right:-120px;top:290px;background:radial-gradient(circle,var(--blobB),transparent 68%);animation:drift2 19s ease-in-out infinite}
.blob.c{width:300px;height:300px;left:30px;bottom:-90px;background:radial-gradient(circle,var(--blobC),transparent 70%);animation:drift1 23s ease-in-out infinite}
.caustic{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,var(--clight),transparent 68%)}
.glass{background:linear-gradient(180deg,var(--sheen),transparent 44%) padding-box,var(--glass) padding-box,linear-gradient(180deg,var(--bgtop),var(--bgbot)) border-box;backdrop-filter:blur(var(--blur)) saturate(200%);-webkit-backdrop-filter:blur(var(--blur)) saturate(200%);border:var(--bw) solid transparent;box-shadow:var(--gshadow),var(--glow-border),var(--reflet),inset 0 1px 0 var(--ghi),inset 0 -14px 32px rgba(255,255,255,0.05)}
.content{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:0 24px;opacity:1;transform:translateX(0);transition:opacity 300ms cubic-bezier(.22,1,.36,1),transform 350ms cubic-bezier(.22,1,.36,1)}
.content.from-right{opacity:0;transform:translateX(32px)}.content.exit-left{opacity:0;transform:translateX(-32px)}
.content.fade-out{opacity:0;transform:scale(.97)}
.statusbar{height:46px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding:0 4px}
.time{font-weight:700;font-size:15px;letter-spacing:.3px}.sysicons{display:flex;align-items:center;gap:7px;color:var(--tp)}
.progbar{display:flex;gap:5px;flex-shrink:0}
.progseg{flex:1;height:4px;border-radius:2px;background:var(--accentsoft)}.progseg.done{background:var(--accent)}
.stitle{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:24px;letter-spacing:-.8px;line-height:1.2;margin-top:18px;flex-shrink:0}
.scroll{flex:1;overflow-y:auto;padding-top:14px;padding-bottom:4px}
.bottom{flex-shrink:0}
.btnprimary{width:100%;padding:20px 24px;border-radius:999px;background:var(--accent);color:var(--onacc);font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:17px;border:none;cursor:pointer;margin-top:14px;letter-spacing:.1px}
.homeind{height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pill{width:122px;height:5px;border-radius:3px;background:var(--tp);opacity:.32}
.scard{border-radius:22px;padding:16px 18px;margin-top:10px;cursor:pointer;transition:transform 220ms cubic-bezier(.22,1,.36,1),opacity 220ms}
.scrow{display:flex;align-items:center;gap:12px;justify-content:space-between}
.scicon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accentsoft);color:var(--accent);flex-shrink:0}
.sclabel{font-size:12px;font-weight:600;color:var(--ts);text-transform:uppercase;letter-spacing:.5px}
.scval{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:15px;margin-top:3px}.scarrow{color:var(--tt);flex-shrink:0;opacity:.55}
.warncard{border-radius:22px;padding:18px;margin-top:12px;background:var(--warnbg);border:2px solid var(--warnborder)}
.warnttl{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:15px;color:var(--warn);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.warntxt{font-size:13px;color:var(--ts);line-height:1.6}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,55px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,-45px)}}
@keyframes cf1{0%,100%{transform:translate(0,0) scale(1) rotate(0deg)}33%{transform:translate(22px,-16px) scale(1.18) rotate(14deg)}66%{transform:translate(-14px,22px) scale(.88) rotate(-9deg)}}
@keyframes cf2{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(-20px,14px) scale(1.22) rotate(6deg)}70%{transform:translate(16px,-11px) scale(.84) rotate(-11eg)}}
@keyframes cf3{0%,100%{transform:translate(0,0) scale(1) rotate(0deg)}50%{transform:translate(12px,24px) scale(1.12) rotate(22deg)}}
.still .blob,.still .caustic{animation:none}@keyframes riseIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</helmet>
<div class="phone {{ theme }}"><div class="bg"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div><div class="caustic a"></div><div class="caustic b"></div><div class="caustic c"></div><div class="caustic d"></div><div class="caustic e"></div></div><div class="content"><div class="statusbar"><span class="time">9:41</span><div class="sysicons"><svg width="18" height="16" viewBox="0 0 18 16" fill="currentColor"><rect x="0" y="11" width="3" height="5" rx="1"></rect><rect x="5" y="8" width="3" height="8" rx="1"></rect><rect x="10" y="5" width="3" height="11" rx="1"></rect><rect x="15" y="2" width="3" height="14" rx="1"></rect></svg><svg width="25" height="14" viewBox="0 0 25 14" fill="none"><rect x="1" y="1.5" width="20" height="11" rx="3.5" stroke="currentColor" stroke-width="1.4"></rect><rect x="3" y="3.5" width="13.5" height="7" rx="2" fill="currentColor"></rect><rect x="22.5" y="4.5" width="2" height="5" rx="1" fill="currentColor"></rect></svg></div></div><div class="progbar"><div class="progseg done"></div><div class="progseg done"></div><div class="progseg done"></div><div class="progseg done"></div><div class="progseg done"></div><div class="progseg done"></div><div class="progseg done"></div></div><div class="stitle">Tout est prêt.</div><div class="scroll"><div class="scard glass" onClick="{{ toApps }}" style-active="{{ tapActive }}"><div class="scrow"><div class="scicon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg></div><div><div class="sclabel">Apps filtrées</div><div class="scval">{{ appsLabel }}</div></div><div class="scarrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></div></div></div><div class="scard glass" onClick="{{ toModeLibre }}" style-active="{{ tapActive }}"><div class="scrow"><div class="scicon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></div><div><div class="sclabel">Mode libre</div><div class="scval">{{ mlLabel }}</div></div><div class="scarrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></div></div></div><div class="scard glass" onClick="{{ toRapport }}" style-active="{{ tapActive }}"><div class="scrow"><div class="scicon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></div><div><div class="sclabel">Rapport hebdo</div><div class="scval">{{ rapportLabel }}</div></div><div class="scarrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></div></div></div><div class="scard glass" onClick="{{ toTemps }}" style-active="{{ tapActive }}"><div class="scrow"><div class="scicon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg></div><div><div class="sclabel">Temps estimé</div><div class="scval">{{ tempsLabel }}</div></div><div class="scarrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></div></div></div><div class="warncard"><div class="warnttl"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>Important</div><div class="warntxt">Ces réglages sont verrouillés une fois activé. Tu pourras toujours désinstaller l'app, mais pas contourner le blocage tant qu'elle est là.</div></div></div><div class="bottom"><button class="btnprimary" onClick="{{ activate }}">Activer NoDoomScroll</button></div><div class="homeind"><div class="pill"></div></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;412px&quot;,&quot;height&quot;:&quot;892px&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    const root = ReactDOM.findDOMNode(this);
    if (!root) return;
    const el = root.querySelector('.content');
    if (el) { el.classList.add('from-right'); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('from-right'))); }
    root.querySelectorAll('.scroll > *,.btnprimary').forEach((it,i)=>{ it.style.animation='riseIn .65s cubic-bezier(.22,1,.36,1) '+(0.06+i*0.11).toFixed(2)+'s both'; });
    root.querySelectorAll('.caustic').forEach(c => {
      c.style.top=(Math.random()*72).toFixed(1)+'%'; c.style.left=(Math.random()*72).toFixed(1)+'%';
      c.style.width=Math.round(70+Math.random()*170)+'px'; c.style.height=Math.round(70+Math.random()*170)+'px';
      c.style.animationDuration=(5+Math.random()*9).toFixed(1)+'s'; c.style.animationDelay='-'+(Math.random()*12).toFixed(1)+'s';
    });
    const sc = root.querySelector('.scroll');
    if (sc) { sc.style.scrollbarWidth='none'; sc.style.msOverflowStyle='none'; }
    if (!document.getElementById('_noscr')) { const s=document.createElement('style'); s.id='_noscr'; s.textContent='.scroll::-webkit-scrollbar{display:none}'; document.head.appendChild(s); }
  }
  navigate(url) {
    const root = ReactDOM.findDOMNode(this);
    const el = root && root.querySelector('.content');
    if (el) el.classList.add('exit-left');
    setTimeout(() => { window.location.href = url; }, 320);
  }
  fmt(min) {
    if (!min || min===0) return '0 min';
    if (min < 60) return min + ' min';
    const h=Math.floor(min/60), m=min%60;
    return h + ' h' + (m?' '+m:'');
  }
  renderVals() {
    const theme = this.props.theme ?? 'light';
    let apps={instagram:true,youtube:true,tiktok:true,snapchat:true}, ml={duration:'15 min',freq:'1×/jour',plage:'12h–14h',delay:'10 min'}, temps={ig:45,yt:60,tt:30,sc:20}, rapport={day:'Dimanche',hour:'20h'};
    try { const d=localStorage.getItem('nds_apps'); if(d) apps=JSON.parse(d); } catch(e){}
    try { const d=localStorage.getItem('nds_ml'); if(d) ml=JSON.parse(d); } catch(e){}
    try { const d=localStorage.getItem('nds_temps'); if(d) temps=JSON.parse(d); } catch(e){}
    try { const d=localStorage.getItem('nds_rapport'); if(d) rapport=JSON.parse(d); } catch(e){}
    const appNames = ['Instagram','YouTube','TikTok','Snapchat'].filter((_,i) => [apps.instagram,apps.youtube,apps.tiktok,apps.snapchat][i]);
    const appsLabel = appNames.join(', ') || 'Aucune';
    const mlLabel = (ml.duration||'15 min') + ' · ' + (ml.freq||'1×/jour') + ' · ' + (ml.plage||'12h–14h');
    const rapportLabel = (rapport.day||'Dimanche') + ' ' + (rapport.hour||'20h');
    const totalMin = (apps.instagram?+temps.ig:0) + (apps.youtube?+temps.yt:0) + (apps.tiktok?+temps.tt:0) + (apps.snapchat?+temps.sc:0);
    const tempsLabel = this.fmt(totalMin) + ' / jour';
    const tapActive = { transform: 'scale(.97)', opacity: '.8' };
    return {
      theme, appsLabel, mlLabel, rapportLabel, tempsLabel,
      tapActive,
      toApps:      () => this.navigate('./Onboarding3-Apps.dc.html'),
      toModeLibre: () => this.navigate('./Onboarding4-ModeLibre.dc.html'),
      toRapport:   () => this.navigate('./Onboarding6-Rapport.dc.html'),
      toTemps:     () => this.navigate('./Onboarding5-Temps.dc.html'),
      activate: () => {
        localStorage.setItem('nds_active', '1');
        const root = ReactDOM.findDOMNode(this);
        const el = root && root.querySelector('.content');
        if (el) el.classList.add('fade-out');
        setTimeout(() => { window.location.href = './HomeScreen.dc.html'; }, 400);
      },
    };
  }
}
</script>
</body>

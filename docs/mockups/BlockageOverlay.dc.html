<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
.light{--ov-bg:rgba(236,246,240,0.62);--ov-blur:28px;--card-bg1:rgba(255,255,255,0.72);--card-bg2:rgba(255,255,255,0.52);--card-border-top:rgba(255,255,255,0.95);--card-border-bot:rgba(255,255,255,0.55);--card-shadow:0 20px 56px rgba(94,140,114,0.18),inset 0 1px 0 rgba(255,255,255,0.90);--card-sheen:rgba(255,255,255,0.60);--icon-bg:rgba(94,140,114,0.10);--icon-border:rgba(94,140,114,0.20);--icon-stroke:rgba(94,140,114,0.80);--title-color:#1a2820;--app-color:#5A6B62;--body-color:#6A7B72;--btn-back-bg:#22302A;--btn-back-color:#fff;--btn-free-color:#8A9890;--btn-free-border:rgba(34,48,42,0.15)}
.dark{--ov-bg:rgba(4,9,6,0.50);--ov-blur:30px;--card-bg1:rgba(42,60,51,0.55);--card-bg2:rgba(30,48,38,0.40);--card-border-top:rgba(200,230,212,0.50);--card-border-bot:rgba(156,196,172,0.18);--card-shadow:0 24px 64px rgba(0,0,0,0.65),inset 0 1px 0 rgba(205,255,224,0.22);--card-sheen:rgba(200,245,222,0.12);--icon-bg:rgba(156,196,172,0.10);--icon-border:rgba(156,196,172,0.22);--icon-stroke:rgba(156,196,172,0.80);--title-color:#EAF2ED;--app-color:#6E7E75;--body-color:#A7B8AE;--btn-back-bg:rgba(255,255,255,0.94);--btn-back-color:#0d1810;--btn-free-color:#6E7E75;--btn-free-border:rgba(255,255,255,0.14)}
.phone{width:412px;height:892px;border-radius:48px;overflow:hidden;position:relative;font-family:'Nunito Sans',sans-serif;box-shadow:0 40px 90px rgba(0,0,0,0.5)}
.appbg{position:absolute;inset:0;z-index:0;background:linear-gradient(175deg,#1a0a2e 0%,#0d1f3c 28%,#0a2a1a 62%,#1a1208 100%)}
.appbg-light1{position:absolute;inset:0;background:radial-gradient(ellipse 280px 440px at 50% 36%,rgba(130,70,210,0.42),transparent 68%),radial-gradient(ellipse 340px 220px at 72% 74%,rgba(210,110,50,0.26),transparent 68%)}
.appbg-figure{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);width:200px;height:380px;background:linear-gradient(180deg,rgba(100,60,180,0.12),rgba(60,40,120,0.35) 55%,rgba(20,12,40,0.6) 100%);border-radius:100px;filter:blur(3px)}
.app-statusbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:1}
.app-time{font-weight:700;font-size:15px;letter-spacing:.3px;color:rgba(255,255,255,0.9)}
.app-sys{display:flex;align-items:center;gap:7px;color:rgba(255,255,255,0.85)}
.app-actions{position:absolute;right:14px;bottom:160px;display:flex;flex-direction:column;align-items:center;gap:24px}
.app-act{display:flex;flex-direction:column;align-items:center;gap:5px;color:rgba(255,255,255,0.78)}
.app-actlabel{font-size:11px;font-weight:600}
.app-info{position:absolute;left:16px;bottom:68px;right:76px}
.app-user{font-size:14px;font-weight:700;color:rgba(255,255,255,0.85);font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-.2px}
.app-caption{font-size:12px;color:rgba(255,255,255,0.45);margin-top:7px;line-height:1.55}
.app-navbar{position:absolute;bottom:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:space-around;background:rgba(0,0,0,0.55);border-top:1px solid rgba(255,255,255,0.08);padding-bottom:6px}
.app-homeind{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:100px;height:4px;border-radius:3px;background:rgba(255,255,255,0.3)}
.overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--ov-bg);backdrop-filter:blur(var(--ov-blur)) saturate(130%);-webkit-backdrop-filter:blur(var(--ov-blur)) saturate(130%)}
.card{width:100%;border-radius:28px;padding:32px 24px;display:flex;flex-direction:column;align-items:center;background:linear-gradient(160deg,var(--card-sheen),transparent 40%) padding-box,linear-gradient(160deg,var(--card-bg1),var(--card-bg2)) padding-box,linear-gradient(160deg,var(--card-border-top),var(--card-border-bot)) border-box;border:1.5px solid transparent;box-shadow:var(--card-shadow)}
.icon{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:var(--icon-bg);border:1.5px solid var(--icon-border);margin-bottom:20px}
.ctitle{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:20px;letter-spacing:-.4px;color:var(--title-color);text-align:center}
.capp{font-size:12px;font-weight:600;color:var(--app-color);margin-top:6px;text-align:center;letter-spacing:.4px;text-transform:uppercase;font-family:'Plus Jakarta Sans',sans-serif}
.cline{width:36px;height:1px;background:var(--btn-free-border);margin:20px auto}
.cbody{font-size:15px;color:var(--body-color);text-align:center;line-height:1.6;letter-spacing:.05px}
.btnback{width:100%;margin-top:26px;padding:17px 24px;border-radius:999px;background:var(--btn-back-bg);color:var(--btn-back-color);font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:16px;border:none;cursor:pointer}
.btnfree{width:100%;margin-top:10px;padding:14px 24px;border-radius:999px;background:transparent;color:var(--btn-free-color);font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:14px;border:1.5px solid var(--btn-free-border);cursor:pointer;text-align:center}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}@keyframes cardBloom{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}
</style>
</helmet>
<div class="phone {{ theme }}"><div class="appbg"><div class="appbg-light1"></div><div class="appbg-figure"></div></div><div class="app-statusbar"><span class="app-time">9:41</span><div class="app-sys"><svg width="18" height="16" viewBox="0 0 18 16" fill="currentColor"><rect x="0" y="11" width="3" height="5" rx="1"></rect><rect x="5" y="8" width="3" height="8" rx="1"></rect><rect x="10" y="5" width="3" height="11" rx="1"></rect><rect x="15" y="2" width="3" height="14" rx="1"></rect></svg><svg width="25" height="14" viewBox="0 0 25 14" fill="none"><rect x="1" y="1.5" width="20" height="11" rx="3.5" stroke="currentColor" stroke-width="1.4"></rect><rect x="3" y="3.5" width="13.5" height="7" rx="2" fill="currentColor"></rect><rect x="22.5" y="4.5" width="2" height="5" rx="1" fill="currentColor"></rect></svg></div></div><div class="app-actions"><div class="app-act"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span class="app-actlabel">12k</span></div><div class="app-act"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg><span class="app-actlabel">834</span></div><div class="app-act"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg><span class="app-actlabel">Partager</span></div></div><div class="app-info"><div class="app-user">@username</div><div class="app-caption">Lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod…</div></div><div class="app-navbar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.8" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><svg width="22" height="22" viewBox="0 0 24 24" fill="rgba(255,255,255,0.95)" stroke="rgba(255,255,255,0.95)" stroke-width="1.2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.8" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div><div class="app-homeind"></div><div class="overlay"><div class="card"><div class="icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{ iconStroke }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="3"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div><div class="ctitle">Contenu bloqué</div><div class="capp">{{ appLabel }}</div><div class="cline"></div><div class="cbody">Tu as choisi de ne pas voir ça.</div><button class="btnback">Retour</button><sc-if value="{{ showModeFree }}" hint-placeholder-val="{{ true }}"><button class="btnfree">{{ modeFreeLabel }}</button></sc-if></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: &quot;412px&quot;, &quot;height&quot;: &quot;892px&quot;},
  &quot;theme&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;light&quot;,&quot;dark&quot;], &quot;default&quot;: &quot;light&quot;, &quot;tsType&quot;: &quot;'light'|'dark'&quot;},
  &quot;appName&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Instagram&quot;,&quot;TikTok&quot;,&quot;YouTube&quot;,&quot;Snapchat&quot;,&quot;Twitter&quot;,&quot;Reddit&quot;], &quot;default&quot;: &quot;Instagram&quot;, &quot;tsType&quot;: &quot;string&quot;},
  &quot;section&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Reels&quot;,&quot;For You&quot;,&quot;Explore&quot;,&quot;Shorts&quot;,&quot;Discover&quot;,&quot;Home&quot;], &quot;default&quot;: &quot;Reels&quot;, &quot;tsType&quot;: &quot;string&quot;},
  &quot;modeFreeState&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;disponible&quot;,&quot;délai&quot;,&quot;épuisé&quot;,&quot;hors_plage&quot;,&quot;jamais&quot;], &quot;default&quot;: &quot;disponible&quot;, &quot;tsType&quot;: &quot;string&quot;},
  &quot;modeFreeCountdown&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;04:32&quot;, &quot;tsType&quot;: &quot;string&quot;},
  &quot;modeFreeNextTime&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;demain 9h00&quot;, &quot;tsType&quot;: &quot;string&quot;}
}">
class Component extends DCLogic {
  componentDidMount() {
    const root = ReactDOM.findDOMNode(this);
    if (!root) return;
    const ov = root.querySelector('.overlay');
    if (ov) ov.style.animation = 'overlayIn .45s ease both';
    const card = root.querySelector('.card');
    if (card) card.style.animation = 'cardBloom .55s cubic-bezier(.34,1.56,.64,1) .1s both';
  }
  renderVals() {
    const theme    = this.props.theme    ?? 'light';
    const appName  = this.props.appName  ?? 'Instagram';
    const section  = this.props.section  ?? 'Reels';
    const state    = this.props.modeFreeState ?? 'disponible';
    const countdown = this.props.modeFreeCountdown ?? '04:32';
    const nextTime  = this.props.modeFreeNextTime  ?? 'demain 9h00';

    const appLabel = appName + ' · ' + section;
    const iconStroke = theme === 'light' ? 'rgba(94,140,114,0.80)' : 'rgba(156,196,172,0.80)';

    let modeFreeLabel = '';
    let showModeFree = true;
    if (state === 'disponible')      modeFreeLabel = 'Mode libre · disponible';
    else if (state === 'délai')      modeFreeLabel = 'Mode libre · ' + countdown;
    else if (state === 'épuisé')     modeFreeLabel = 'Prochain créneau : ' + nextTime;
    else if (state === 'hors_plage') modeFreeLabel = 'Mode libre · disponible à ' + nextTime;
    else if (state === 'jamais')     showModeFree = false;

    return { theme, appLabel, iconStroke, modeFreeLabel, showModeFree };
  }
}
</script>
</body>
</html>
